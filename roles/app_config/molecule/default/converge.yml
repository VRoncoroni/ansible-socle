---
- name: Converger
  hosts: all
  become: true
  vars:
    env_name: molecule
    java_home: /opt/java/jdk-21.0.5+11
    app_port: 8080
    app_log_level: debug
    app_db_host: db-molecule.exemple.local
    app_db_password: secret-molecule
    app_config_validate: ""          # le vérificateur vient du paquet, absent ici
  roles:
    - role: app_config
